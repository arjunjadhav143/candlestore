<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us - The Candle Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap');
    body { font-family: 'Poppins', sans-serif; }
    .font-serif { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="bg-stone-50 text-stone-800 font-sans flex flex-col min-h-screen">

  <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-stone-200 shadow-sm transition-all">
    <div class="max-w-7xl mx-auto flex justify-between items-center p-4">
      <div class="flex items-center gap-6">
        <a href="index.html" class="flex items-center gap-2 hover:scale-105 transition"><img src="candle images/1.png" alt="Logo" class="h-10"></a>
        <nav class="hidden md:flex gap-6 text-sm font-medium">
          <a href="index.html" class="hover:text-rose-700 transition pb-1">HOME</a>
          <a href="candles.html" class="hover:text-rose-700 transition pb-1">CANDLES</a>
          <a href="diffusers.html" class="hover:text-rose-700 transition pb-1">DIFFUSERS</a>
          <a href="contact.html" class="text-rose-900 font-bold border-b-2 border-rose-900 pb-1">CONTACT</a>
        </nav>
      </div>
      <div class="flex items-center gap-5 text-stone-700" id="userControls"></div>
    </div>
  </header>

  <main class="flex-grow p-6 max-w-4xl mx-auto w-full mt-10 grid grid-cols-1 md:grid-cols-2 gap-10 animate__animated animate__fadeIn">
    
    <div>
      <h2 class="text-4xl font-bold font-serif text-stone-900 mb-6">Get in Touch</h2>
      <p class="text-stone-500 mb-8 leading-relaxed">Have a question about our scents or need help with an order? We'd love to hear from you.</p>
      
      <div class="bg-white p-6 rounded-2xl border border-stone-100 shadow-sm flex items-center gap-4 mb-4 hover:shadow-md transition">
        <div class="text-3xl text-rose-800 bg-rose-50 w-14 h-14 flex items-center justify-center rounded-full">📱</div>
        <div>
          <h3 class="text-lg font-bold text-stone-800">Call Us</h3>
          <p class="text-stone-500">+91 8669927049</p>
        </div>
      </div>

      <div class="bg-white p-6 rounded-2xl border border-stone-100 shadow-sm flex items-center gap-4 hover:shadow-md transition">
        <div class="text-3xl text-rose-800 bg-rose-50 w-14 h-14 flex items-center justify-center rounded-full">✉</div>
        <div>
          <h3 class="text-lg font-bold text-stone-800">Write Us</h3>
          <p class="text-stone-500">arjunjadhav5002@gmail.com</p>
        </div>
      </div>
    </div>

    <div class="bg-white p-8 rounded-3xl shadow-lg border border-stone-100">
      <form class="space-y-5">
        <div>
          <label class="block mb-1 text-sm font-medium text-stone-700">Name</label>
          <input type="text" class="w-full border border-stone-200 rounded-lg p-3 focus:ring-2 focus:ring-rose-400 bg-stone-50 outline-none" placeholder="Your name">
        </div>
        <div>
          <label class="block mb-1 text-sm font-medium text-stone-700">Email</label>
          <input type="email" class="w-full border border-stone-200 rounded-lg p-3 focus:ring-2 focus:ring-rose-400 bg-stone-50 outline-none" placeholder="Your email">
        </div>
        <div>
          <label class="block mb-1 text-sm font-medium text-stone-700">Message</label>
          <textarea class="w-full border border-stone-200 rounded-lg p-3 focus:ring-2 focus:ring-rose-400 bg-stone-50 outline-none resize-none" rows="4" placeholder="Your message..."></textarea>
        </div>
        <button type="submit" class="bg-stone-900 text-white w-full py-3 rounded-lg font-semibold hover:bg-stone-700 transition shadow-md">Send Message</button>
      </form>
    </div>

  </main>

  <footer class="bg-stone-900 text-stone-300 text-center py-6 mt-10">
    <p class="text-sm">&copy; 2025 The Candle Store. All rights reserved.</p>
  </footer>

  <script>
    const userEmail = localStorage.getItem("userEmail");
    const userControls = document.getElementById("userControls");
    if (userEmail) {
      userControls.innerHTML = `<a href="search.html" class="text-xl">🔍</a><a href="wishlist.html" class="text-xl">🤍</a><a href="orders.html" class="text-xl">🛒</a><button onclick="logout()" class="bg-rose-100 text-rose-700 px-4 py-2 rounded-lg text-sm font-bold ml-2">Logout</button>`;
    } else {
      userControls.innerHTML = `<a href="search.html" class="text-xl">🔍</a><a href="wishlist.html" class="text-xl">🤍</a><a href="orders.html" class="text-xl">🛒</a><a href="signin.html" class="text-xl ml-2">👤</a>`;
    }
    function logout() { localStorage.clear(); location.reload(); }
  </script>
</body>
</html>
