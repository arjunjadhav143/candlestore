<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Candles - The Candle Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap');
    body { font-family: 'Poppins', sans-serif; }
    h1, h2, h3, .font-serif { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="bg-stone-50 text-stone-800 font-sans">

  <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-stone-200 shadow-sm transition-all duration-300">
    <div class="max-w-7xl mx-auto flex justify-between items-center p-4">
      <div class="flex items-center gap-6">
        <a href="index.html" class="flex items-center gap-2 hover:scale-105 transition-transform duration-300">
          <img src="candle images/1.png" alt="Logo" class="h-10 drop-shadow-sm">
        </a>
        <nav class="hidden md:flex gap-6 text-sm font-medium text-stone-600 tracking-wide">
          <a href="index.html" class="hover:text-rose-700 transition-colors pb-1">HOME</a>
          <a href="candles.html" class="text-rose-900 font-bold border-b-2 border-rose-900 pb-1">CANDLES</a>
          <a href="diffusers.html" class="hover:text-rose-700 transition-colors pb-1">DIFFUSERS</a>
          <a href="contact.html" class="hover:text-rose-700 transition-colors pb-1">CONTACT</a>
        </nav>
      </div>
      <div class="flex items-center gap-5 text-stone-700" id="userControls"></div>
    </div>
  </header>

  <div class="bg-stone-200 py-12 text-center animate__animated animate__fadeIn">
    <h1 class="text-4xl font-bold font-serif text-stone-900 uppercase tracking-widest">Our Candles</h1>
    <p class="text-stone-600 mt-2">Find your perfect scent.</p>
  </div>

  <section class="p-6 max-w-7xl mx-auto mt-6">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
      
      <div class="group bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 hover:-translate-y-2 border border-stone-100 animate__animated animate__fadeInUp">
        <div class="relative overflow-hidden h-64">
          <img src="candle images/candle 1.jpg" alt="Jar Candle Set" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
          <button class="absolute top-3 right-3 text-2xl bg-white/80 p-2 rounded-full shadow hover:bg-rose-50 transition wishlist-btn" data-id="candle1" data-name="Black Cup Candle" data-price="1000" data-img="candle images/candle 1.jpg">🤍</button>
        </div>
        <div class="p-5">
          <h3 class="text-xs font-semibold tracking-wider text-stone-400 uppercase mb-1">Indian Candle</h3>
          <h2 class="text-lg font-bold text-stone-800 font-serif">Black Cup Candle</h2>
          <div class="flex justify-between items-center mt-4">
            <p class="text-xl font-bold text-rose-900">₹ 1,000</p>
            <div class="flex items-center gap-2">
              <input type="number" min="1" value="1" class="quantity-input w-12 border border-stone-200 rounded text-center text-sm py-1" data-id="candle1">
              <button class="bg-stone-900 text-white px-4 py-2 text-sm rounded-lg hover:bg-stone-700 transition-colors shadow-md cart-btn" data-id="candle1" data-name="Black Cup Candle" data-price="1000" data-img="candle images/candle 1.jpg">Buy</button>
            </div>
          </div>
        </div>
      </div>

      <div class="group bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 hover:-translate-y-2 border border-stone-100 animate__animated animate__fadeInUp" style="animation-delay: 0.1s;">
        <div class="relative overflow-hidden h-64">
          <img src="candle images/candle 2.jpg" alt="Jar Candle" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
          <button class="absolute top-3 right-3 text-2xl bg-white/80 p-2 rounded-full shadow hover:bg-rose-50 transition wishlist-btn" data-id="candle2" data-name="Jar Candle" data-price="1200" data-img="candle images/candle 2.jpg">🤍</button>
        </div>
        <div class="p-5">
          <h3 class="text-xs font-semibold tracking-wider text-stone-400 uppercase mb-1">Indian Candle</h3>
          <h2 class="text-lg font-bold text-stone-800 font-serif">Jar Candle</h2>
          <div class="flex justify-between items-center mt-4">
            <p class="text-xl font-bold text-rose-900">₹ 1,200</p>
            <div class="flex items-center gap-2">
              <input type="number" min="1" value="1" class="quantity-input w-12 border border-stone-200 rounded text-center text-sm py-1" data-id="candle2">
              <button class="bg-stone-900 text-white px-4 py-2 text-sm rounded-lg hover:bg-stone-700 transition-colors shadow-md cart-btn" data-id="candle2" data-name="Jar Candle" data-price="1200" data-img="candle images/candle 2.jpg">Buy</button>
            </div>
          </div>
        </div>
      </div>

      <div class="group bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 hover:-translate-y-2 border border-stone-100 animate__animated animate__fadeInUp" style="animation-delay: 0.2s;">
        <div class="relative overflow-hidden h-64">
          <img src="candle images/candle 3.jpg" alt="Square Candle" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
          <button class="absolute top-3 right-3 text-2xl bg-white/80 p-2 rounded-full shadow hover:bg-rose-50 transition wishlist-btn" data-id="candle3" data-name="Square Candle" data-price="1200" data-img="candle images/candle 3.jpg">🤍</button>
        </div>
        <div class="p-5">
          <h3 class="text-xs font-semibold tracking-wider text-stone-400 uppercase mb-1">Indian Candle</h3>
          <h2 class="text-lg font-bold text-stone-800 font-serif">Square Candle</h2>
          <div class="flex justify-between items-center mt-4">
            <p class="text-xl font-bold text-rose-900">₹ 1,200</p>
            <div class="flex items-center gap-2">
              <input type="number" min="1" value="1" class="quantity-input w-12 border border-stone-200 rounded text-center text-sm py-1" data-id="candle3">
              <button class="bg-stone-900 text-white px-4 py-2 text-sm rounded-lg hover:bg-stone-700 transition-colors shadow-md cart-btn" data-id="candle3" data-name="Square Candle" data-price="1200" data-img="candle images/candle 3.jpg">Buy</button>
            </div>
          </div>
        </div>
      </div>

      <div class="group bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 hover:-translate-y-2 border border-stone-100 animate__animated animate__fadeInUp" style="animation-delay: 0.3s;">
        <div class="relative overflow-hidden h-64">
          <img src="candle images/candle 4.jpg" alt="Cup Candle" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
          <button class="absolute top-3 right-3 text-2xl bg-white/80 p-2 rounded-full shadow hover:bg-rose-50 transition wishlist-btn" data-id="candle4" data-name="Cup Candle" data-price="1496" data-img="candle images/candle 4.jpg">🤍</button>
        </div>
        <div class="p-5">
          <h3 class="text-xs font-semibold tracking-wider text-stone-400 uppercase mb-1">Indian Candle</h3>
          <h2 class="text-lg font-bold text-stone-800 font-serif">Cup Candle</h2>
          <div class="flex justify-between items-center mt-4">
            <p class="text-xl font-bold text-rose-900">₹ 1,496</p>
            <div class="flex items-center gap-2">
              <input type="number" min="1" value="1" class="quantity-input w-12 border border-stone-200 rounded text-center text-sm py-1" data-id="candle4">
              <button class="bg-stone-900 text-white px-4 py-2 text-sm rounded-lg hover:bg-stone-700 transition-colors shadow-md cart-btn" data-id="candle4" data-name="Cup Candle" data-price="1496" data-img="candle images/candle 4.jpg">Buy</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </section>

  <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 text-white px-6 py-3 rounded-full shadow-2xl hidden z-50 animate__animated animate__fadeInDown text-sm font-medium"></div>
  <div id="confirmModal" class="fixed inset-0 bg-stone-900/60 backdrop-blur-sm flex items-center justify-center hidden z-50 animate__animated animate__fadeIn">
    <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center">
      <p id="confirmMessage" class="text-xl font-bold text-stone-800 mb-6">Place this order?</p>
      <div class="flex justify-center gap-4">
        <button id="confirmYes" class="bg-stone-900 text-white px-6 py-2 rounded-lg hover:bg-stone-700 w-full">Yes</button>
        <button id="confirmNo" class="bg-stone-100 text-stone-700 px-6 py-2 rounded-lg hover:bg-stone-200 w-full">No</button>
      </div>
    </div>
  </div>

  <script>
    const userId = localStorage.getItem("userId");
    const userName = localStorage.getItem("userName");

    document.querySelectorAll('.wishlist-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!userId) { showToast("Please sign in to add to wishlist."); return window.location.href = "signin.html"; }
        if (btn.classList.contains("added")) return;
        const item = { userId, name: btn.dataset.name, price: parseInt(btn.dataset.price), img: btn.dataset.img };
        try {
          const res = await fetch("https://candle-store-backend-qk3r.onrender.com/api/wishlist", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(item) });
          if (res.ok) { btn.innerText = "❤️"; btn.classList.add("text-rose-600"); showToast("Added to wishlist!", "success"); }
          else { showToast("Failed to add.", "error"); }
        } catch (err) { showToast("Server error.", "error"); }
      });
    });

    document.querySelectorAll('.cart-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!userId) { showToast("Please sign in to place an order."); return window.location.href = "signin.html"; }
        const id = btn.dataset.id, name = btn.dataset.name, price = parseInt(btn.dataset.price), img = btn.dataset.img;
        const quantity = parseInt(document.querySelector(`.quantity-input[data-id="${id}"]`)?.value || "1");
        showConfirmation(`Buy ${quantity}x ${name}?`, () => placeOrder({ userId, name: userName, items: [{ name, price, quantity, img }] }));
      });
    });

    const userEmail = localStorage.getItem("userEmail");
    const userControls = document.getElementById("userControls");
    if (userEmail) {
      userControls.innerHTML = `
        <a href="search.html" class="text-xl hover:scale-110 transition">🔍</a>
        <a href="wishlist.html" class="text-xl hover:scale-110 transition">🤍</a>
        <a href="orders.html" class="text-xl hover:scale-110 transition">🛒</a>
        <button onclick="logout()" class="bg-rose-100 text-rose-700 px-4 py-2 rounded-lg text-sm font-bold ml-2">Logout</button>
      `;
    } else {
      userControls.innerHTML = `<a href="search.html" class="text-xl">🔍</a><a href="wishlist.html" class="text-xl">🤍</a><a href="orders.html" class="text-xl">🛒</a><a href="signin.html" class="text-xl ml-2">👤</a>`;
    }

    function logout() { localStorage.clear(); location.reload(); }
    function showToast(message, type = 'info', duration = 3000) { const t = document.getElementById("toast"); t.textContent = message; t.className = `fixed top-5 left-1/2 transform -translate-x-1/2 text-white px-6 py-3 rounded-full shadow-2xl z-50 animate__animated animate__fadeInDown text-sm font-medium ${type==='success'?'bg-green-600':type==='error'?'bg-red-600':'bg-stone-900'}`; setTimeout(()=>t.classList.add("hidden"), duration); }
    function showConfirmation(msg, onConfirm) { const m = document.getElementById("confirmModal"); document.getElementById("confirmMessage").textContent = msg; m.classList.remove("hidden"); const y = document.getElementById("confirmYes"); const ny = y.cloneNode(true); y.parentNode.replaceChild(ny, y); ny.addEventListener("click", () => { m.classList.add("hidden"); onConfirm(); }); document.getElementById("confirmNo").addEventListener("click", () => m.classList.add("hidden")); }
    async function placeOrder(order) { try { const res = await fetch("https://candle-store-backend-qk3r.onrender.com/api/orders", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(order) }); if(res.ok){ localStorage.setItem("orderConfirmed","true"); window.location.href="orders.html"; }else showToast("Failed to place order","error"); }catch(err){ showToast("Server error","error"); } }
  </script>
</body>
</html>
