<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign In - The Candle Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500&display=swap');
    body { font-family: 'Poppins', sans-serif; }
    .font-serif { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="bg-stone-50 text-stone-800 flex flex-col min-h-screen">

  <header class="bg-white/80 backdrop-blur-md border-b border-stone-200 p-4 shadow-sm">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-2"><img src="candle images/1.png" alt="Logo" class="h-10"></a>
    </div>
  </header>

  <main class="flex-grow flex items-center justify-center p-6 animate__animated animate__fadeIn">
    <section class="bg-white p-10 rounded-3xl shadow-xl w-full max-w-md border border-stone-100">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold font-serif text-stone-900">Welcome Back</h1>
        <p class="text-stone-500 mt-2 text-sm">Sign in to access your orders and wishlist.</p>
      </div>

      <form id="signinForm" class="space-y-5">
        <div>
          <label class="block mb-1 text-sm font-medium text-stone-700">Email Address</label>
          <input type="email" id="email" class="w-full border border-stone-200 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-rose-400 bg-stone-50 transition" placeholder="you@example.com" required>
        </div>
        <div>
          <label class="block mb-1 text-sm font-medium text-stone-700">Password</label>
          <input type="password" id="password" class="w-full border border-stone-200 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-rose-400 bg-stone-50 transition" placeholder="••••••••" required>
        </div>
        
        <button type="submit" class="bg-stone-900 text-white w-full py-3 rounded-lg font-semibold hover:bg-stone-700 transition-all shadow-md hover:-translate-y-0.5">Log In</button>
      </form>

      <p id="error" class="text-red-500 text-sm mt-4 text-center hidden bg-red-50 p-2 rounded"></p>
      
      <p class="text-center mt-6 text-sm text-stone-500">
        Don't have an account? <a href="signup.html" class="text-rose-700 font-semibold hover:underline">Create one</a>
      </p>
    </section>
  </main>

  <script>
    if (localStorage.getItem("userEmail")) window.location.href = "index.html";
    
    document.getElementById("signinForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const errorMsg = document.getElementById("error");
      try {
        const res = await fetch("https://candle-store-backend-qk3r.onrender.com/api/auth/login", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: document.getElementById("email").value, password: document.getElementById("password").value })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || "Login failed");

        localStorage.setItem("token", data.token);
        localStorage.setItem("userEmail", document.getElementById("email").value);
        const decoded = JSON.parse(atob(data.token.split('.')[1]));
        localStorage.setItem("userId", decoded.id);
        localStorage.setItem("userName", decoded.name);
        
        window.location.href = "index.html";
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
